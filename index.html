<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1RM 計算器｜7種公式</title>
<style>
*{box-sizing:border-box;font-family:system-ui,sans-serif}
body{max-width:600px;margin:3rem auto;padding:0 1rem}
input{width:100%;padding:8px;margin:6px 0;font-size:16px}
button{padding:10px 16px;background:#222;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer}
.result{margin-top:1.5rem}
.item{padding:8px 0;border-bottom:1px solid #eee}
.note{margin-top:2rem;color:#666;font-size:14px}
</style>
</head>
<body>
<h2>1RM 一迴極限計算器</h2>
<label>訓練重量 (kg)</label>
<input id="weight" type="number" step="0.1" placeholder="例如：80">
<label>完成次數</label>
<input id="rep" type="number" min="1" max="20" placeholder="例如：5">
<button onclick="calc()">計算</button>
<div class="result" id="out"></div>
<div class="note">
備註：以下全部為預測值，不等同實際測試1RM；次數建議不要超過12次，誤差會比較大
</div>

<script>
function calc(){
  const w = parseFloat(document.getElementById('weight').value)
  const r = parseInt(document.getElementById('rep').value)
  if(!w || !r || r<1){
    document.getElementById('out').innerHTML = "<p>請輸入有效的數字</p>"
    return
  }
  const e = Math.E
  const data = [
    ["Brzycki", w / (1.0278 - 0.0278 * r)],
    ["Epley", w * (1 + 0.0333 * r)],
    ["Lander", w * Math.pow(1 + 0.0333 * r, 0.9784)],
    ["Lombardi", w * Math.pow(r, 0.10)],
    ["Mayhew", 100 * w / (52.2 + 41.9 * Math.exp(-0.055 * r))],
    ["O'Conner", w * (1 + 0.025 * r)],
    ["Wathen", 100 * w / (48.8 + 53.8 * Math.exp(-0.0484 * r))]
  ]
  let html = ""
  data.forEach(row=>{
    html += `<div class="item"><b>${row[0]}</b>：${row[1].toFixed(2)} kg</div>`
  })
  document.getElementById('out').innerHTML = html
}
</script>
</body>
</html>
